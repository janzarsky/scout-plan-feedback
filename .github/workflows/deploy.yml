name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.REGION }}
          source: "."
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            STREAMLIT_AUTH__REDIRECT_URI=${{ secrets.APP_URL }}/oauth2callback
          secrets: |
            STREAMLIT_AUTH__GOOGLE__CLIENT_ID=STREAMLIT_GOOGLE_CLIENT_ID:latest
            STREAMLIT_AUTH__GOOGLE__CLIENT_SECRET=STREAMLIT_GOOGLE_CLIENT_SECRET:latest
            STREAMLIT_AUTH__COOKIE_SECRET=STREAMLIT_COOKIE_SECRET:latest
          flags: "--allow-unauthenticated"
